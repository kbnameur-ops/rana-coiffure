<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" role="img" aria-label="Épilation">
  <defs>
    <linearGradient id="e-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfaf6"/><stop offset="1" stop-color="#f4e6e1"/>
    </linearGradient>
    <linearGradient id="e-cire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9ba72"/><stop offset="1" stop-color="#8a6a26"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="600" fill="url(#e-bg)"/>
  <circle cx="800" cy="300" r="250" fill="#f7f0e7"/>

  <!-- Le pot de cire et sa spatule, coulée reprise en dégradé. -->
  <g fill="none" stroke="#1f2e4a" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M690 250 h 220 v 176 a 40 40 0 0 1 -40 40 h -140 a 40 40 0 0 1 -40 -40 z"/>
    <path d="M666 250 h 268"/>
  </g>
  <path d="M700 320 h 200 v 106 a 30 30 0 0 1 -30 30 h -140 a 30 30 0 0 1 -30 -30 z" fill="url(#e-cire)" opacity="0.85"/>
  <g fill="none" stroke="#8a6a26" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M974 460 L 1010 190 a 26 26 0 0 1 50 6 L 1030 452"/>
    <path d="M984 400 h 40"/>
  </g>

  <!-- La peau lissée : des courbes parallèles que rien n'accroche. -->
  <g fill="none" stroke="#1f2e4a" stroke-width="2.4" stroke-linecap="round" opacity="0.5">
    <path d="M210 120 C 300 220, 300 380, 210 480"/>
    <path d="M264 108 C 360 216, 360 384, 264 492"/>
    <path d="M318 120 C 412 220, 412 380, 318 480"/>
  </g>
  <g fill="none" stroke="#d9ba72" stroke-width="2.4" stroke-linecap="round">
    <path d="M237 114 C 330 218, 330 382, 237 486"/>
    <path d="M291 114 C 386 218, 386 382, 291 486"/>
  </g>

  <!-- Bandes de cire prêtes. -->
  <g stroke="#8a6a26" stroke-width="2.6" fill="#fbf6ee" fill-opacity="0.65">
    <rect x="1180" y="176" width="180" height="112" rx="10" transform="rotate(-8 1270 232)"/>
    <rect x="1210" y="308" width="180" height="112" rx="10" transform="rotate(7 1300 364)"/>
  </g>
  <path d="M110 552 H 1490" stroke="#8a6a26" stroke-width="1.2" opacity="0.45"/>
</svg>
